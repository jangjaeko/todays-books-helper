<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>YES24 도서정보 추출</title>
<style>
  :root {
    --accent: #0064ff;
    --border: #e2e5ea;
    --text: #222;
    --muted: #888;
    --bg-soft: #f7f8fa;
  }
  * { box-sizing: border-box; }
  body {
    width: 380px;
    margin: 0;
    padding: 14px;
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: var(--text);
    background: #fff;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  h1 .badge {
    font-size: 10px;
    color: #fff;
    background: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  #status {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  /* 조회 중 스피너 */
  @keyframes spin { to { transform: rotate(360deg); } }
  #status.loading::before {
    content: "";
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 6px;
    border: 2px solid #c9ced6;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -1px;
  }
  /* YES24에서 무게까지 한 번에 추출 성공(보완 불필요): 초록 강조 */
  #status.extract-ok {
    color: #157347;
    font-weight: 700;
    background: #e9f9ef;
    border: 1px solid #b7e9c8;
    border-radius: 6px;
    padding: 7px 9px;
  }
  /* 무게 보완 성공 시(교보문고/알라딘): 눈에 확 띄게 */
  #status.weight-ok {
    color: #b23a00;
    font-weight: 700;
    background: #fff3e6;
    border: 1px solid #ffcfa3;
    border-radius: 6px;
    padding: 7px 9px;
  }
  /* 어디에도 무게가 없을 때: 빨간 경고 (수동 입력 필요) */
  #status.weight-fail {
    color: #c1121f;
    font-weight: 700;
    background: #fdecec;
    border: 1px solid #f5b5b5;
    border-radius: 6px;
    padding: 7px 9px;
  }
  /* 무게 필드 옆 출처 배지 */
  .src-badge {
    display: inline-block;
    color: #fff;
    background: #ff6a00;
    font-weight: 700;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 4px;
    margin-left: 4px;
    vertical-align: middle;
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin: 12px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .rate-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  .rate-row label { font-size: 12px; color: var(--text); white-space: nowrap; }
  .rate-row input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    width: 70px;
  }
  .rate-row .canada-price {
    margin-left: auto;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
  }

  .field {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 6px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .field .label {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .field .value {
    font-size: 12.5px;
    font-weight: 500;
    word-break: break-all;
  }
  .field .value.empty {
    color: #c33;
    font-weight: 400;
  }
  .field-main { flex: 1; }
  .weight-input {
    width: 120px;
    margin-top: 3px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
  }
  .copy-btn {
    flex-shrink: 0;
    border: none;
    background: #f2f4f7;
    color: #555;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .copy-btn:hover { background: #e6e9ee; }

  .case-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    margin-bottom: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 12.5px;
  }
  .case-btn:hover { background: var(--bg-soft); }
  .case-btn .case-name { font-weight: 700; }
  .case-btn .case-desc { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }

  .actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .actions button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
    background: #f2f4f7;
    color: #333;
  }

  #toast {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: #fff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  #toast.show { opacity: 0.92; }

  details { margin-top: 4px; }
  summary { font-size: 11px; color: var(--muted); cursor: pointer; margin-bottom: 6px; }
</style>
</head>
<body>
  <h1>📚 YES24 도서정보 추출<span class="badge">개인용</span></h1>
  <div id="status">불러오는 중…</div>

  <div class="rate-row">
    <label for="discountRate">할인율</label>
    <input type="number" id="discountRate" step="0.001" value="0.775" />
    <span class="canada-price" id="canadaPriceDisplay">CAD -</span>
  </div>

  <div class="rate-row">
    <label for="marginInput">마진값</label>
    <input type="number" id="marginInput" step="1" value="53" />
  </div>

  <div class="section-title">양식 선택 후 복사 (엑셀 붙여넣기용)</div>
  <button class="case-btn" id="case1Btn">
    <span class="case-name">Case 1 · SALES</span>
    <span class="case-desc">캐나다가격ㅣ빈칸ㅣTitleㅣPublisherㅣAuthorㅣCopiesㅣKRWㅣWeight</span>
  </button>
  <button class="case-btn" id="case2Btn">
    <span class="case-name">Case 2 · 선박</span>
    <span class="case-desc">ISBNㅣ제목ㅣ캐나다가격ㅣ…ㅣAuthorㅣ출판일자ㅣPublisherㅣSubjectㅣ…ㅣKRWㅣWeightㅣ회원리뷰</span>
  </button>
  <button class="case-btn" id="case3Btn">
    <span class="case-name">Case 3 · LBI (2줄)</span>
    <span class="case-desc">1줄: ISBN/캐나다가격/Pub.Date/Subject · 2줄: Title/Author/Publisher</span>
  </button>

  <details>
    <summary>추출된 원본 값 보기 / 개별 복사</summary>
    <div id="fields"></div>
  </details>

  <div class="actions">
    <button id="reloadBtn">다시추출 (교보문고 검색)</button>
  </div>
  <div id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
